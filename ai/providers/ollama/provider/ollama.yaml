background: '#F9FAFB'
configurate_methods:
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    - models/rerank/rerank.py
    provider_source: provider/ollama.py
help:
  title:
    en_US: How to integrate with Ollama
    zh_Hans: 如何集成 Ollama
  url:
    en_US: https://ssrag.com/docs/getting-started/models/ollama.html
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Ollama
provider: ollama
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: Base URL
      zh_Hans: 基础 URL
    placeholder:
      en_US: Base url of Ollama server, e.g. http://192.168.1.100:11434
      zh_Hans: Ollama server 的基础 URL，例如 http://192.168.1.100:11434
    required: true
    type: text-input
    variable: base_url
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
supported_model_types:
- llm
- text-embedding
- rerank
